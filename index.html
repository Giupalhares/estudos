<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 40px}
h1{font:600 22px/1.2 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;margin:6px 0 12px;letter-spacing:.2px}
h2{font-size:16px;margin:0 0 10px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
nav button{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:#06161a}}
:root[data-theme="dark"] nav button.on{color:#06161a}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
@media(max-width:700px){.hero{grid-template-columns:1fr}}
.big{font:600 56px/1 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;color:var(--ac)}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{border-left:3px solid var(--ac);padding:2px 0 2px 10px}
.k b{display:block;font:600 22px/1.2 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac)}
.bar.w i{background:var(--wa)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);font-size:14px;vertical-align:middle}
th{font-weight:500;color:var(--mu);font-size:13px}
td.n{font-variant-numeric:tabular-nums}
.st{color:var(--wa);letter-spacing:1px;white-space:nowrap}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:90px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 16px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#06161a}}
:root[data-theme="dark"] .btn{color:#06161a}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:16px;padding:2px 6px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.row .t{flex:1;min-width:0}
.row input[type=checkbox]{width:20px;height:20px;flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:5px 10px;border-radius:6px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.late{color:var(--er);font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:50;display:none;max-width:92%;font-size:14px}
#toast button{margin-left:10px;border:0;background:transparent;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}
.tmd{text-align:center;font:600 64px/1 "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;color:var(--ac);margin:8px 0}
button:disabled{opacity:.45;cursor:default}
.nt{font-size:12px;color:var(--mu);margin-top:2px;font-weight:400}.pv{font-size:12px;color:var(--er);margin-top:2px;font-weight:500}
.tag{flex:0 0 auto;min-width:84px;text-align:center;font:600 12px/1 inherit;font-family:inherit;border-radius:999px;padding:6px 8px;border:1px dashed var(--bd);color:var(--mu);background:transparent;cursor:pointer}
.i1{background:#2e9e5b;color:#fff;border:1px solid #2e9e5b}.i2{background:#f2c200;color:#1b1b1b;border:1px solid #f2c200}.i3{background:#ee7d12;color:#fff;border:1px solid #ee7d12}.i4{background:#d32f2f;color:#fff;border:1px solid #d32f2f}
.b1{border-left:5px solid #2e9e5b}.b2{border-left:5px solid #f2c200}.b3{border-left:5px solid #ee7d12}.b4{border-left:5px solid #d32f2f}.b0{border-left:5px solid transparent}
.row.b1,.row.b2,.row.b3,.row.b4,.row.b0{padding-left:8px}
.d1{background:#2e9e5b}.d2{background:#f2c200}.d3{background:#ee7d12}.d4{background:#d32f2f}.d0{background:var(--mu)}
.bar.c i{background:inherit}
.row.top .t{font-weight:600}
.done{text-decoration:line-through;color:var(--mu)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.dm{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.dc{font-size:11px;border:1px solid var(--bd);border-radius:999px;padding:0 7px;color:var(--mu)}.dc.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}.dc.bad{border-color:var(--er);color:var(--er)}.why{font-size:12px;color:var(--er);margin-top:2px}

.cw{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:0 14px 14px;margin-bottom:12px;max-width:560px;margin-left:auto;margin-right:auto;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.cwt{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 -14px 10px;padding:8px 10px 8px 14px;background:var(--ac2);border-bottom:1px solid var(--bd);border-radius:10px 10px 0 0;font-weight:600}
.cwb{display:flex;gap:4px;flex-wrap:wrap}.cwb button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:3px 8px;font:inherit;font-size:12px;cursor:pointer}.cwb button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cwr{display:flex;gap:22px;margin:4px 0 6px}.cwr label{display:flex;gap:6px;align-items:center;font-size:15px;color:var(--tx)}

.cwl{display:block;margin:8px 0 4px;font-size:14px;color:var(--tx)}.cws{width:100%}
.cwg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.cwg label{font-size:13px}
.cwp{background:var(--ac2);border:1px solid var(--ac);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:14px}

#flt .cw.fl .cwd{font-size:38px;margin:4px 0 6px}#flt .cw.fl .cwbt .big{padding:9px 4px;font-size:15px}
#flt .cwm{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:14px}#flt .cwm b{font-family:inherit;font-weight:700;font-size:22px;line-height:1;color:#1f4fd8;font-variant-numeric:tabular-nums}
@media(max-width:600px){#flt .cw.fl{left:8px;right:8px;width:auto}}
body.hasflt .wrap{padding-bottom:300px}
.card.today{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
</style>
